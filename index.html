<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function(){
        var t = localStorage.getItem('lotus-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lotus List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=DM+Mono:wght@300;400;500&family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #FAF7F2; font-family: 'Jost', sans-serif; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #C8C2BA; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #A09890; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .subtask-row:hover .subtask-del { opacity: 1 !important; }
      :root {
        --canvas: #f6f3ec;
        --sidebar: #11201a;
      }
      html[data-theme="dark"] {
        --canvas: #0f140f;
        --sidebar: #0a120c;
      }
      body { background: var(--canvas); }
      ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.28); }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
